name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-and-contracts:
    name: Server and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: slopbook
          POSTGRES_USER: slopbook
          POSTGRES_PASSWORD: ci-slopbook-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slopbook -d slopbook"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/slopbook?user=slopbook&password=ci-slopbook-only
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: 1.12.0.1530
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: clojure-${{ runner.os }}-
      - name: Resolve dependencies
        run: clojure -P -M:test
      - name: Clojure domain, application, adapter tests
        run: clojure -M:test
      - name: PostgreSQL migration and constraint integration tests
        run: clojure -M:integration
      - name: Namespace architecture fitness
        run: clojure -M:architecture

  client:
    name: ClojureScript test and release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: ClojureScript tests
        run: npm run cljs:test
      - name: ClojureScript release
        run: npm run cljs:release

  artifact:
    name: Uberjar and container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [server-and-contracts, client]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: 1.12.0.1530
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Install and build immutable artifact
        run: |
          npm ci
          npm run uberjar
      - name: Standalone artifact smoke
        run: |
          SLOPBOOK_PORT=18080 SLOPBOOK_AI_ALLOW_LOCAL=true \
            java -jar target/slopbook-0.2.0-standalone.jar > /tmp/slopbook.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18080/health/live >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              sed -n '1,100p' /tmp/slopbook.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --max-time 2 http://127.0.0.1:18080/ >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18080/api/v1/not-real)" = "404"
      - name: Build runtime image
        run: docker build --build-arg IF0_COMMIT=${{ github.sha }} --tag slopbook:${{ github.sha }} .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slopbook-standalone-${{ github.sha }}
          path: target/slopbook-0.2.0-standalone.jar
          if-no-files-found: error
          retention-days: 7
