services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: slopbook
      POSTGRES_USER: slopbook
      POSTGRES_PASSWORD: local-slopbook-only
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slopbook -d slopbook"]
      interval: 2s
      timeout: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
